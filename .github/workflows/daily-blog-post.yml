name: 애드센스용 블로그 자동 발행

on:
  schedule:
    # A모드: 하루 2회 (한국시간 10:17, 18:17 = UTC 01:17, 09:17)
    # 정각(:00)은 GitHub 부하로 지연·스킵이 잦아 17분으로 둠
    - cron: "17 1 * * *"
    - cron: "17 9 * * *"
  workflow_dispatch:

jobs:
  post-blog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate and publish post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          G_REFRESH_TOKEN: ${{ secrets.G_REFRESH_TOKEN }}
          G_CLIENT_ID: ${{ secrets.G_CLIENT_ID }}
          G_CLIENT_SECRET: ${{ secrets.G_CLIENT_SECRET }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          POST_AS_DRAFT: ${{ vars.POST_AS_DRAFT || 'false' }}
          BLOG_NICHE: ${{ vars.BLOG_NICHE || '생활정보와 실용 가이드' }}
          PRIMARY_LABEL: ${{ vars.PRIMARY_LABEL || '생활꿀팁' }}
          TOPIC_SOURCE: ${{ vars.TOPIC_SOURCE || 'topics' }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
        run: python main.py

      - name: Success notice
        if: success()
        run: |
          echo "발행(또는 초안) 성공"
          echo "시간: $(date -u)"

      - name: Failure notice
        if: failure()
        run: |
          echo "실패 — Actions 로그를 확인하세요."
